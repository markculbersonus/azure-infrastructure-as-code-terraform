<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Azure infrastructure deployed using Terraform</title><desc id="desc">Terraform manages a resource group, storage account, virtual network with two subnets, a network security group associated with subnet2, and a Log Analytics workspace.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#eef4ff}.sub{fill:#b6c7e5}.box{fill:#1c2c4c;stroke:#5275b3;stroke-width:2}.h{font-size:29px;font-weight:bold}.t{font-size:20px}.s{font-size:16px}.line{stroke:#76c7e7;stroke-width:3;fill:none}</style></defs><rect width="1200" height="780" fill="#0e1930"/><text x="45" y="58" class="h">Azure Infrastructure as Code with Terraform</text><text x="45" y="90" class="t sub">Resource provisioning, configuration drift, and troubleshooting</text><rect x="45" y="130" width="250" height="105" rx="15" class="box"/><text x="70" y="174" class="h">Terraform</text><text x="70" y="207" class="s sub">main.tf + provider.tf</text><path d="M295 180 H350" class="line"/><rect x="350" y="128" width="800" height="510" rx="18" fill="#14243f" stroke="#518ee4" stroke-width="3"/><text x="375" y="167" class="h">Azure resource group</text><text x="375" y="194" class="s sub">example-resources · East US</text><rect x="375" y="225" width="350" height="125" rx="14" class="box"/><text x="395" y="265" class="t">Storage account</text><text x="395" y="295" class="s sub">storageaccountname156435</text><text x="395" y="320" class="s sub">StorageV2 · Standard GRS</text><rect x="750" y="225" width="375" height="125" rx="14" class="box"/><text x="770" y="265" class="t">Log Analytics workspace</text><text x="770" y="295" class="s sub">example · 30-day retention</text><text x="770" y="320" class="s sub">Registered Microsoft.OperationalInsights</text><rect x="375" y="375" width="750" height="230" rx="14" fill="#163a49" stroke="#3dc4b4" stroke-width="2"/><text x="400" y="410" class="t">Virtual network: example-network</text><text x="400" y="438" class="s sub">10.0.0.0/16 · DNS: 10.0.0.4, 10.0.0.5</text><rect x="400" y="466" width="325" height="107" rx="12" class="box"/><text x="420" y="505" class="t">subnet1</text><text x="420" y="538" class="s sub">10.0.1.0/24</text><rect x="750" y="466" width="350" height="107" rx="12" class="box"/><text x="770" y="505" class="t">subnet2</text><text x="770" y="535" class="s sub">10.0.2.0/24 · NSG associated</text><rect x="45" y="285" width="280" height="170" rx="14" class="box"/><text x="65" y="325" class="t">Network security group</text><text x="65" y="360" class="s sub">example-security-group</text><text x="65" y="389" class="s sub">0 custom rules</text><text x="65" y="417" class="s sub">Azure default rules apply</text><path d="M325 395 H345 V585 H925 V574" class="line" stroke-dasharray="7 6"/><text x="45" y="684" class="t">Engineering outcomes</text><text x="45" y="718" class="s sub">Configuration drift detected: manual billingTag removed by Terraform reconciliation</text><text x="45" y="747" class="s sub">409 registration error resolved: Microsoft.OperationalInsights registered, then apply succeeded</text></svg>